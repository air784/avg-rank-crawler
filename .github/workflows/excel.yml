name: 生成Excel

on:
  schedule:
    # 每天北京时间 00:20 生成前一天的日报，并更新总集
    - cron: "20 16 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "日期（如 2026-10-05），也可填 today 或 all；留空为昨天"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python make_excel.py "${{ github.event.inputs.day }}"
      - name: 提交 Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Excel $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          git pull --rebase
          git push
